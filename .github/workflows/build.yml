name: Build and Release

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'sstv_solver.py'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install numpy scipy Pillow pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --name sstv_solver sstv_solver.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sstv_solver-linux-amd64
          path: dist/sstv_solver

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install numpy scipy Pillow pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --name sstv_solver.exe sstv_solver.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sstv_solver-windows-amd64
          path: dist/sstv_solver.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sstv_solver-linux-amd64
          path: artifacts/

      - uses: actions/download-artifact@v4
        with:
          name: sstv_solver-windows-amd64
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/sstv_solver
            artifacts/sstv_solver.exe
          body: |
            ## CTF SSTV Solver ${{ github.ref_name }}

            Automated SSTV audio decoder for CTF challenges.
            CTF 竞赛用 SSTV 音频自动解码器。

            ### Downloads / 下载

            | Platform | File |
            |----------|------|
            | Windows (amd64) | `sstv_solver.exe` |
            | Linux (amd64) | `sstv_solver` |

            ### Quick Usage / 快速使用

            ```bash
            # Windows: drag WAV onto exe, or / 拖拽 WAV 到 exe 上，或
            sstv_solver.exe signal.wav

            # Linux
            ./sstv_solver signal.wav -o ./out/

            # Batch: all WAVs in a directory / 批量处理目录下所有 WAV
            sstv_solver ./captures/
            ```

            Supports 18 SSTV modes with auto-detection and multi-strategy fallback.
            支持 18 种 SSTV 模式，自动检测 VIS 码，未知模式自动多策略回退。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
